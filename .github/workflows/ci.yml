name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The verified gate: type-check, unit tests, production build. No external deps.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:run
      - run: npm run build

  # The Playwright E2E against the local Supabase Docker stack.
  # NOTE: marked continue-on-error until verified green on the runner — the
  # Supabase CLI/config can drift between versions. Flip to a hard gate once green.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: cp .env.example .env
      - run: npm run test:e2e
